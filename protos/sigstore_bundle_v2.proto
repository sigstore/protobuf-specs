syntax = "proto3";
package dev.sigstore.bundle.v2;

import "google/api/field_behavior.proto";

import "sigstore_common.proto";

option go_package = "github.com/sigstore/protobuf-specs/gen/pb-go/bundle/v2";
option java_package = "dev.sigstore.proto.bundle.v2";
option java_multiple_files = true;
option java_outer_classname = "BundleProtoV2";
option ruby_package = "Sigstore::Bundle::V2";

message TimestampVerificationData {
        repeated dev.sigstore.common.v1.RFC3161SignedTimestamp rfc3161_timestamps = 1;
}

// The raw message is never signed; it is always hashed, as there is otherwise
// a risk of transmitting large payloads to an HSM.
// When signing a DSSE payload, the DSSE Pre-Authentication Encoding (PAE) is
// used as the data, with this Sigstore-specific signature scheme.
message Signature {
        // The signature is computed over a domain-separated message:
        // sigstore.dev/v1 || 0x00 || SHA256(SHA256(data)) if data is not
        // submitted to a log,
        // c2sp.org/identity-transparency/v1 || 0x00 || SHA256(SHA256(data))
        // if data is submitted to a log.
        bytes signature = 1 [(google.api.field_behavior) = REQUIRED];
}

// Payload represents a DSSE payload as defined in https://github.com/secure-systems-lab/dsse.
// When present in a Bundle, the signed data is the DSSE Pre-Authentication Encoding (PAE):
// "DSSEv1" + SP + LEN(payload_type) + SP + payload_type + SP + LEN(payload) + SP + payload
message Payload {
        string payload_type = 1 [(google.api.field_behavior) = REQUIRED];
        bytes payload = 2 [(google.api.field_behavior) = REQUIRED];
}

message TransparencyLogProof {
        // The log proof, formatted per c2sp.org/tlog-proof.
        // If OIDC-based submission is used, the `extra` field contains the
        // relevant claims needed for recreation of the leaf during
        // verification. They are stored as an unordered list of elements
        // matching "key:value" separated by `\n` (0x0a).
        // The key is the name of the context category as specified in the leaf specification.
        // When the credential is an identity token, all value strings will be the parsed identity
        // and provenance values from the token.
        // When the credential is a public key, the `extra` field will be the provided
        // context as a hex-encoded string.
        bytes proof = 1 [(google.api.field_behavior) = REQUIRED];
        // Only set when the credential is a public key/signature.
        // If a signature is part of the leaf, verifiers MUST verify the
        // artifact's signature and confirm that the signature matches
        // what was submitted to the log.
        // If the artifact was signed prior to log submission, the
        // signature is over
        // c2sp.org/identity-transparency/v1 || 0x00 || SHA256(SHA256(data))
        optional Signature signature = 2;
}

message PublicKey {
        // Optional timestamps to enable key rotation when a signature is not
        // logged (witnesses provide a counter-signature with timestamp).
        optional TimestampVerificationData timestamps = 1;
        // The signature over the domain-separated message for the artifact (or DSSE PAE).
        Signature signature = 2 [(google.api.field_behavior) = REQUIRED];
}

message Certificate {
        // The end-entity certificate used for signing
        dev.sigstore.common.v1.X509Certificate certificate = 1 [(google.api.field_behavior) = REQUIRED];
        // Optional list of untrusted intermediates used for chain
        // building. When signing with Sigstore PGI, this list MUST be empty
        // as the intermediates are provided via the TUF root.
        optional dev.sigstore.common.v1.X509CertificateChain intermediates = 2;
        // Timestamps proving the signature was created during the certificate's
        // validity period.
        TimestampVerificationData timestamps = 3 [(google.api.field_behavior) = REQUIRED];
        // The signature over the domain-separated message for the artifact (or DSSE PAE).
        Signature signature = 4 [(google.api.field_behavior) = REQUIRED];
}

message VerificationMaterial {
        oneof content {
                // Signed with a managed key pair
                PublicKey public_key = 1 [(google.api.field_behavior) = REQUIRED];
                // Signed with a key included in a certificate and RFC 3161 timestamp
                Certificate certificate = 2 [(google.api.field_behavior) = REQUIRED];
                // Signed by logging to Rekor, authenticating with an ID token or
                // a public key/signature.
                TransparencyLogProof transparency_log_proof = 3 [(google.api.field_behavior) = REQUIRED];
        }
}

message Bundle {
        // MUST be application/vnd.dev.sigstore.bundle.v2.0+json when
        // encoded as JSON.
        string media_type = 1;
        VerificationMaterial verification_material = 2 [(google.api.field_behavior) = REQUIRED];
        optional Payload payload = 3;
}
